<div #skillsWrapper class="skills-container pt-4 pb-4 content-wrapper">
  <h1 style="color: white; font-weight: bold" class="text-center mb-5">
    {{ "Comercial Projects" | uppercase }}
  </h1>
  <div class="sub-container d-flex justify-content-around">
    <div class="skills-slider">
      <div class="slide">
        <div *ngIf="slides && arrayForSlideDots.length > 0" class="slider-dots">
          <ng-container *ngFor="let item of arrayForSlideDots">
            <div
              [ngStyle]="{
                'background-color': getStyleCondition(item) ? 'white' : null
              }"
            ></div>
          </ng-container>
        </div>
        <div
          appHoverHighlight="arrow-hover"
          (click)="moveLeft()"
          class="arrow-left"
        >
          <img
            src="https://raw.githubusercontent.com/cez0000/buisness-page/master/src/assets/img/arrow-left.svg"
            alt=""
          />
        </div>
        <div
          appHoverHighlight="arrow-hover"
          (click)="moveRight()"
          class="arrow-right"
        >
          <img
            src="https://raw.githubusercontent.com/cez0000/buisness-page/master/src/assets/img/arrow-right.svg"
            alt=""
          />
        </div>
        <div #contentWrapper class="content-wrapper d-flex">
          <ng-container *ngFor="let item of projects">
            <div #slide [id]="item.id" class="slide-content">
              <div class="image-wrapper">
                <img class="pro-img" style="cursor: zoom-in;" appImageModal [src]="item.imgUrl" alt=""
                />
                <div class="text d-flex justify-content-between">
                  {{ item.name }}
                  <span>
                    <a [href]="item?.webURL"
                    ><img
                    style="width: 30px;
                    height: 30px;
                    transform: translate(-10px,-12px);"
                      src="https://raw.githubusercontent.com/cez0000/buisness-page/master/src/assets/img/world-wide-web.svg"
                      alt="visit"
                  /></a></span>
                </div>
              </div>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
    <div>
      <app-project-reference-widget [isComercial]="true" [currentProjectComercial]="getCurrentProject()">
      </app-project-reference-widget>
    </div>
  </div>
</div>
