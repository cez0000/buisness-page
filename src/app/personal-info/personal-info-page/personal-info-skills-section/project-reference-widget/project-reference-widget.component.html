<div class="project-ref-wrapper d-flex position-relative">
  <h3 class="position-absolute ref-text">
    {{getTitle}}
  </h3>
  <ng-container *ngIf="!isComercial"> 
    <img
    style="cursor:zoom-in;"
    [style.width]="currentProject.relatedSkill === skills.Net ? '20%' : null"
    [style.transform]="
      currentProject.relatedSkill === skills.Net ? 'translate(50%)' : null
    "
    [src]="getSrc(currentProject.relatedSkill)"
    class="img-wrapper"
    (click)="showImage(currentProject.relatedSkill)"
  />
  <div class="project-info d-flex flex-column">
    <span>{{ currentProject.info[0] }}</span>
    <span>{{ currentProject.info[1] }}</span>
    <span>{{ currentProject.info[2] }}</span>
    <div class="d-flex icons">
      <a [href]="currentProject.gitHubUrl"
        >
      <img
        src="https://raw.githubusercontent.com/cez0000/buisness-page/master/src/assets/img/github.svg"
        alt="check repo"
      />
      </a>
      <a [href]="currentProject.webURL"
        ><img
          src="https://raw.githubusercontent.com/cez0000/buisness-page/master/src/assets/img/world-wide-web.svg"
          alt="visit"
      /></a>
    </div>
  </div>
  </ng-container>
  <ng-container *ngIf="isComercial"> 
    <div style="font-size: 20px; padding: 20px;" class="mt-5">
        {{currentProjectComercial?.info?.[0]}}
    </div>
    
</ng-container>

 
</div>
